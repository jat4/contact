<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html">Contact Center</a><nav><a href="index.html">Contact Us</a><a href="track.html">Track Application</a></nav></header><main class="shell"><section class="hero"><span class="eyebrow">CONTACT US</span><h1>How can we help?</h1><p>Send us your message. After submitting, you will receive an Application Number that you can use to track the conversation.</p></section><section class="card"><form id="contactForm"><div class="grid two"><label>Name <span>*</span><input name="name" required maxlength="100" autocomplete="given-name"></label><label>Last Name <small>(optional)</small><input name="lastName" maxlength="100" autocomplete="family-name"></label></div><div class="grid two"><label>Email <span>*</span><input type="email" name="email" required maxlength="254" autocomplete="email"></label><label>Mobile Number <span>*</span><input type="tel" name="mobileNumber" required maxlength="20" autocomplete="tel"></label></div><label>Message <span>*</span><textarea name="message" required maxlength="5000" rows="7" placeholder="Write your message..."></textarea></label><button class="button" type="submit" id="submitButton">Submit</button><p class="form-status" id="formStatus" role="status"></p></form></section></main><script type="module" src="app.js"></script></body></html>
