<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Application</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Contact Center</a>
    <nav>
      <a href="index.html">Contact Us</a>
      <a href="track.html">Track Application</a>
    </nav>
  </header>

  <main class="shell">
    <section class="hero">
      <span class="eyebrow">TRACK APPLICATION</span>
      <h1>Check your conversation</h1>
      <p>
        Enter the Application Number you received after submission and the
        same Mobile Number used in the form.
      </p>
    </section>

    <section class="card">
      <form id="trackForm">
        <label>
          Application Number <span>*</span>
          <input
            name="applicationNumber"
            required
            placeholder="APP-20260926-XXXXXXXX"
          >
        </label>

        <label>
          Mobile Number <span>*</span>
          <input type="tel" name="mobileNumber" required>
        </label>

        <button class="button" type="submit" id="trackButton">
          Track Application
        </button>

        <p class="form-status" id="trackStatus" role="status"></p>
      </form>
    </section>

    <section id="conversation" class="conversation hidden"></section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
